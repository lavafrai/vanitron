name: Rust Multi-OS Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Test default GPU-enabled build
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Test CPU-only build
        run: cargo test --locked --no-default-features --target ${{ matrix.target }}

      - name: Build CPU-only
        run: cargo build --locked --release --no-default-features --target ${{ matrix.target }}

      - name: Build default GPU-enabled artifact
        run: cargo build --locked --release --target ${{ matrix.target }}
        
      - name: Prepare artifact
        run: |
          mkdir artifacts
          cp target/${{ matrix.target }}/release/vanitron${{ matrix.ext }} artifacts/vanitron${{ matrix.ext }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vanitron-${{ matrix.target }}
          path: artifacts/*
          retention-days: 7
